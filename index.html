<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>بطاقة عضوية</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Tajawal", sans-serif;
      color: #182033;
      background: linear-gradient(145deg, #f2f6ff, #fff 55%, #effaf7);
    }

    .page {
      width: min(100% - 32px, 960px);
      margin: 0 auto;
      padding: 48px 0;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 5vw, 42px);
    }

    header p {
      margin: 0;
      color: #68738a;
      font-size: 17px;
    }

    .app {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      align-items: center;
      background: #fff;
      border: 1px solid #e8edf5;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 18px 55px #253b6012;
    }

    .title {
      display: block;
      margin-bottom: 10px;
      font-weight: 700;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #d9e0eb;
      border-radius: 12px;
      font: inherit;
      font-size: 17px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #4778df;
      box-shadow: 0 0 0 3px #4778df20;
    }

    .hint {
      margin: 8px 0 22px;
      color: #7a8496;
      font-size: 14px;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
      margin-bottom: 22px;
    }

    .choice {
      position: relative;
    }

    .choice input {
      position: absolute;
      opacity: 0;
    }

    .choice span {
      display: block;
      padding: 11px 8px;
      text-align: center;
      border: 1px solid #dfe5ee;
      border-radius: 11px;
      cursor: pointer;
      transition: 0.2s;
    }

    .choice input:checked + span {
      color: #315fc5;
      background: #eef3ff;
      border-color: #7698e6;
      font-weight: 700;
    }

    .photo-section {
      margin: 22px 0;
      padding: 15px;
      background: #f5f7fb;
      border-radius: 12px;
      border: 2px dashed #d9e0eb;
    }

    .photo-section .title {
      margin-bottom: 12px;
    }

    #photoInput {
      display: none;
    }

    .photo-upload-btn {
      width: 100%;
      padding: 14px;
      background: #50c878;
      color: #fff;
      border: none;
      border-radius: 12px;
      font: inherit;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
      margin-bottom: 8px;
    }

    .photo-upload-btn:hover {
      background: #3ba860;
    }

    .photo-upload-btn:active {
      transform: scale(0.98);
    }

    .photo-name {
      font-size: 13px;
      color: #7a8496;
      text-align: center;
      margin: 8px 0;
      min-height: 20px;
    }

    .photo-name.success {
      color: #27ae60;
      font-weight: 700;
    }

    .photo-preview {
      width: 80px;
      height: 80px;
      margin: 10px auto;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      display: none;
    }

    .photo-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .download-btn {
      width: 100%;
      padding: 14px;
      background: #315fc5;
      color: #fff;
      border: none;
      border-radius: 12px;
      font: inherit;
      font-weight: 700;
      font-size: 17px;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 15px;
    }

    .download-btn:hover {
      background: #2549a0;
    }

    .download-btn:active {
      transform: scale(0.98);
    }

    .preview-area {
      display: grid;
      place-items: center;
      padding: 14px;
      background: #f5f7fb;
      border-radius: 18px;
    }

    .card {
      width: 100%;
      max-width: 337px;
      aspect-ratio: 337 / 509;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      background: linear-gradient(135deg, #003d82 0%, #1a5f9d 100%);
      box-shadow: 0 15px 30px #1a2b4b30;
    }

    .card-photo {
      position: absolute;
      z-index: 1;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 3px solid rgba(255, 255, 255, 0.4);
      overflow: hidden;
    }

    .card-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .name {
      position: absolute;
      z-index: 2;
      top: 62%;
      right: 7%;
      left: 7%;
      max-width: 86%;
      margin: auto;
      color: #fff;
      text-align: center;
      overflow-wrap: anywhere;
      font-size: clamp(17px, 5vw, 25px);
      line-height: 1.4;
      font-weight: 800;
      text-shadow: 0 1px 4px #00192d;
    }

    .role {
      position: absolute;
      z-index: 2;
      top: 73%;
      right: 8%;
      left: 8%;
      margin: 0;
      color: #d9b36c;
      text-align: center;
      font-size: clamp(14px, 4vw, 19px);
      font-weight: 700;
      text-shadow: 0 1px 4px #00192d;
    }

    /* Share Sheet Modal */
    .share-modal {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      top: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      animation: fadeIn 0.3s ease;
    }

    .share-modal.active {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .share-content {
      background: #f5f7fb;
      border-radius: 24px 24px 0 0;
      padding: 20px;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }
      to {
        transform: translateY(0);
      }
    }

    .share-preview {
      background: white;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: center;
    }

    .share-preview img {
      width: 100%;
      max-width: 280px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .share-preview p {
      margin: 0;
      color: #68738a;
      font-size: 14px;
    }

    .share-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .share-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px 10px;
      background: white;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      transition: 0.2s;
      font-family: "Tajawal", sans-serif;
    }

    .share-option:hover {
      background: #e8edf5;
      transform: scale(1.05);
    }

    .share-option:active {
      transform: scale(0.95);
    }

    .share-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .share-label {
      font-size: 12px;
      color: #182033;
      font-weight: 700;
      text-align: center;
    }

    .share-close {
      width: 100%;
      padding: 14px;
      background: white;
      border: none;
      border-radius: 12px;
      font: inherit;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
      color: #68738a;
    }

    .share-close:active {
      background: #f5f7fb;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #68738a;
      z-index: 10;
    }

    @media (max-width: 700px) {
      .page {
        padding: 30px 0;
      }

      .app {
        grid-template-columns: 1fr;
        padding: 18px;
        gap: 22px;
      }

      .card {
        width: min(100%, 337px);
      }

      .share-options {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header>
      <h1>أنشئ بطاقة عضويتك</h1>
      <p>اكتب الاسم واختر التصنيف وأضف صورتك.</p>
    </header>

    <section class="app">
      <div class="controls">
        <label class="title" for="personName">الاسم أو المسمى</label>

        <input
          id="personName"
          type="text"
          maxlength="60"
          placeholder="مثال: نورة أحمد العتيبي"
          autocomplete="name"
        >

        <p class="hint">تتحدث معاينة البطاقة تلقائياً أثناء الكتابة.</p>

        <div class="title">اختر التصنيف</div>

        <div class="choices">
          <label class="choice">
            <input type="radio" name="role" value="موظف" checked>
            <span>موظف</span>
          </label>

          <label class="choice">
            <input type="radio" name="role" value="موظفة">
            <span>موظفة</span>
          </label>

          <label class="choice">
            <input type="radio" name="role" value="معلم">
            <span>معلم</span>
          </label>

          <label class="choice">
            <input type="radio" name="role" value="معلمة">
            <span>معلمة</span>
          </label>

          <label class="choice">
            <input type="radio" name="role" value="طالب">
            <span>طالب</span>
          </label>

          <label class="choice">
            <input type="radio" name="role" value="طالبة">
            <span>طالبة</span>
          </label>
        </div>

        <div class="photo-section">
          <label class="title" for="photoInput">📷 أضف صورتك</label>
          <input
            type="file"
            id="photoInput"
            accept="image/*"
            capture="environment"
          >
          <button class="photo-upload-btn" onclick="document.getElementById('photoInput').click()">
            📸 اختر صورة من الاستديو
          </button>
          <div class="photo-preview" id="photoPreview">
            <img id="photoImage" alt="الصورة">
          </div>
          <div class="photo-name" id="photoName"></div>
        </div>

        <button class="download-btn" id="downloadBtn">💾 تحميل البطاقة</button>
      </div>

      <div class="preview-area">
        <div class="card" id="cardElement">
          <div class="card-photo">
            <img id="cardPhotoImage" alt="الصورة" style="display:none;">
          </div>
          <div class="name" id="cardName">اسمك هنا</div>
          <div class="role" id="cardRole">موظف</div>
        </div>
      </div>
    </section>
  </main>

  <!-- Share Modal -->
  <div class="share-modal" id="shareModal">
    <button class="close-btn" onclick="closeShareModal()">✕</button>
    
    <div class="share-content">
      <div class="share-preview">
        <img id="shareImage" alt="البطاقة">
        <p>بطاقة العضوية الخاصة بك</p>
      </div>

      <div class="share-options">
        <button class="share-option" onclick="shareWhatsApp()">
          <span class="share-icon">💬</span>
          <span class="share-label">واتساب</span>
        </button>

        <button class="share-option" onclick="shareTwitter()">
          <span class="share-icon">𝕏</span>
          <span class="share-label">تويتر</span>
        </button>

        <button class="share-option" onclick="shareEmail()">
          <span class="share-icon">✉️</span>
          <span class="share-label">بريد</span>
        </button>

        <button class="share-option" onclick="shareFacebook()">
          <span class="share-icon">👍</span>
          <span class="share-label">فيسبوك</span>
        </button>

        <button class="share-option" onclick="copyImage()">
          <span class="share-icon">📋</span>
          <span class="share-
